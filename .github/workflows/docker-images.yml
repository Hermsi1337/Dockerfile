name: Build & push Docker images (GHCR)

on:
  pull_request: {}
  push:
    branches: ["master"]
  workflow_dispatch: {}

concurrency:
  group: docker-images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        version: ["7.4", "8.1", "8.2", "8.3", "8.4"]

    steps:
      - uses: actions/checkout@v4

      - name: Compute vars (lowercase namespace + short sha)
        id: vars
        shell: bash
        run: |
          ns="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          sha_short="$(echo "${GITHUB_SHA}" | cut -c1-12)"
          echo "namespace=${ns}" >> "$GITHUB_OUTPUT"
          echo "sha_short=${sha_short}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR (only on master push)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build php:${{ matrix.version }} (local sha tag)
        run: |
          PHP_LOCAL="local-php:${{ matrix.version }}-${{ steps.vars.outputs.sha_short }}"
          cd "docker/php-official/${{ matrix.version }}"
          docker build --no-cache --pull -t "$PHP_LOCAL" .
          echo "PHP_LOCAL=$PHP_LOCAL" >> "$GITHUB_ENV"

      - name: Build php-apache:${{ matrix.version }} (FROM local sha tag)
        run: |
          APACHE_LOCAL="local-php-apache:${{ matrix.version }}-${{ steps.vars.outputs.sha_short }}"
          cd "docker/php-apache/${{ matrix.version }}"
          docker build \
            --build-arg BASE_IMAGE="${PHP_LOCAL}" \
            -t "$APACHE_LOCAL" .
          echo "APACHE_LOCAL=$APACHE_LOCAL" >> "$GITHUB_ENV"

      - name: Push images (only on master push)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        run: |
          ns="${{ steps.vars.outputs.namespace }}"

          php_target="${{ env.REGISTRY }}/${ns}/php:${{ matrix.version }}"
          apache_target="${{ env.REGISTRY }}/${ns}/php-apache:${{ matrix.version }}"

          docker tag "${PHP_LOCAL}" "$php_target"
          docker push "$php_target"

          docker tag "${APACHE_LOCAL}" "$apache_target"
          docker push "$apache_target"
